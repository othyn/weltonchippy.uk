name: Lint

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 14
          check-latest: true
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Run linter
        run: yarn lint
